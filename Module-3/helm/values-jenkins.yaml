# Jenkins Helm Chart 커스텀 values 예제
#
# ⚠️ 주의: edu/jenkins 차트를 단독으로 사용하면 플러그인 버전 충돌이 발생합니다.
# Jenkins 설치는 Module-4/jenkins-cicd/jenkins-install/install-jenkins.sh를 사용하세요.
#
# 이 파일은 Helm values 파일 형식의 참고용 예제입니다.

controller:
  serviceType: LoadBalancer
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

persistence:
  enabled: true
  # storageClass 생략 시 기본 StorageClass 사용
  # - 바닐라 K8s: managed-nfs-storage
  # - GKE: standard-rwo
  size: 10Gi
