name: build

# app/ 이 바뀐 push에서 frontend, backend 이미지를 빌드해 GHCR로 올립니다.
# 처음 만들어진 패키지는 private일 수 있습니다. public 전환은 6회차 가이드를 따릅니다.
# 외부 시크릿 없이 fork 직후 바로 동작합니다(GITHUB_TOKEN만 사용).
on:
  push:
    branches:
      - main
    # k8s/ 만 바꾸는 push(7회차 replicas 변경 등)에는 불필요한 재빌드를 하지 않습니다.
    paths:
      - "app/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 이미지 경로는 소문자만 허용하므로 owner를 소문자로 변환합니다.
      - name: Resolve image owner (lowercase)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./app/${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/ssf15-${{ matrix.component }}:v1
            ghcr.io/${{ steps.owner.outputs.name }}/ssf15-${{ matrix.component }}:${{ github.sha }}
