apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # 이 replicas 값이 7회차 GitOps 변경 지점입니다.
  # 2 이상으로 두어 새로고침 시 응답 Pod(podName)가 바뀌는 것을 보이게 합니다.
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # 1~5회차: 강사 사전 빌드 이미지. 6회차에 본인 fork 이미지로 교체합니다.
          image: ghcr.io/sysnet4admin/ssf15-backend:v1
          # 같은 :v1 태그로 다시 빌드해도 새 이미지를 받아오게 합니다.
          # 기본값(IfNotPresent)이면 노드에 캐시된 옛 이미지를 계속 씁니다(6회차).
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # /healthz로 Pod의 준비(readiness)와 생존(liveness)을 확인합니다.
          # 준비가 확인된 Pod에만 트래픽이 가고, 응답이 없으면 재시작됩니다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          # 5회차에서 다룹니다.
          # ConfigMap(MESSAGE)은 Git의 configmap.yaml에서 주입합니다.
          # Secret(API_KEY)은 Git에 두지 않고 5회차에 클러스터에 직접 생성해 참조만 합니다.
          # optional: true 이므로 ConfigMap/Secret이 아직 없어도 Pod는 정상 기동합니다.
          envFrom:
            - configMapRef:
                name: app-config
                optional: true
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: api-key
                  optional: true
