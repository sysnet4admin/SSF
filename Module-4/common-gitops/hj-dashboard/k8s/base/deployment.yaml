apiVersion: apps/v1
kind: Deployment
metadata:
  name: hj-dashboard
  labels:
    app: hj-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hj-dashboard
  template:
    metadata:
      labels:
        app: hj-dashboard
    spec:
      containers:
      - name: hj-dashboard
        image: docker.io/library/hj-dashboard:blue
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: NODE_ENV
          value: "production"
