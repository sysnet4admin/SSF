apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hj-dashboard
  namespace: argocd
spec:
  project: default

  source:
    # GitHub 저장소 URL (본인 Fork로 변경)
    repoURL: https://github.com/sysnet4admin/SSF
    targetRevision: main
    path: Module-4/common-gitops/hj-dashboard/k8s/overlays/vanilla

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
    - CreateNamespace=true
